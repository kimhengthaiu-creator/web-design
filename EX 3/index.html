<!DOCTYPE html>
<html>
  <head>
    <title>Flexbox Pricing Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Sono", sans-serif;
        background-color: #A5BFC9;
      }
      .pricing-container{
        display: flex;
        justify-content: space-evenly;
        flex-direction: row;
        gap: 20px;
        margin: 100px 100px;
      }
      .pricing-plan{
        display: flex;
        flex-direction: column;
        align-items: center;
        font-size: 20px;
        border: 1px solid black;
        border-radius: 0.5em;
      }
      .plan-title{
        color: white;
        background-color: #B48DBA;
        text-align: center;
        width: 100%;
        box-sizing: border-box;
        border-radius: 0.5em;
        padding: 10px;
      }
      .plan-price{
        color: brown;
        text-align: center;
        padding-top: 30px;
      }
      .plan-features{
        padding: 10px 20px;
        font-size: 15px;
        margin: 20px;
        border-radius: 0.5em;
        border: 1px solid black ;
        background-color: rgb(178, 173, 241);
        color:black;
      }  
      .plan-button{
       display: flex;
       justify-content: center;
       align-items: center;
       margin: 20px;
       background-color: greenyellow;
       border-radius: 0.5em;
      }
      .plan-button:hover{
        background-color: aquamarine;
        padding: 20px 20px;
      }
      span{
        font-size: 30px;
        color: rgb(58, 58, 56);
      }
      /* Hint: What can you do with a media query and flexbox? */
      @media (max-width: 1250px) {
        .pricing-container {
        flex-direction: column;
        align-items: center;
        gap: 30px;
      }
      }
    </style>
  </head>

  <body>
    <div class="pricing-container">
      <div class="pricing-plan">
        <div class="plan-title">Basic</div>
        <div class="plan-price"><span>$9.99</span>/month</div>
        <ul class="plan-features">
          <li>✅ 10GB Storage</li>
          <li>✅ 1 User</li>
          <li>🚫 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Standard</div>
        <div class="plan-price"><span>$19.99</span>/month</div>
        <ul class="plan-features">
          <li>✅ 50GB Storage</li>
          <li>✅ 5 Users</li>
          <li>✅ Phone &amp; Email Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Premium</div>
        <div class="plan-price"><span>$49.99</span>/month</div>
        <ul class="plan-features">
          <li>✅ 100GB Storage</li>
          <li>✅ 10 Users</li>
          <li>✅ 24/7 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
    </div>
  </body>
</html>
