<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercise 3 - Flexbox layout</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    color: #fff;
    min-height: 100vh;
    padding: 1rem;
    display: flex;
    flex-direction: column;   
    gap: 1rem;             
  }

  .box {
    border-radius: 0.5rem;
    padding: 1rem;
  }

  header  { flex: 0 0 auto; background: #1e90ff; box-shadow: 0 0.25rem 0.5rem #0077ea; }
  footer  { flex: 0 0 auto; background: #4169e1; box-shadow: 0 0.25rem 0.5rem #1d44b8; }

  .middle {
    flex: 1 1 auto;
    display: flex;
    gap: 1rem;
  }

  main {
    flex: 1 1 0;            
    background: #3cb371;
    box-shadow: 0 0.25rem 0.5rem #2f8d59;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  aside {
    flex: 0 0 12rem;
    background: #ff6347;
    box-shadow: 0 0.25rem 0.5rem #e02200;
  }

  .items {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    align-content: flex-start;
  }

  .item {
    flex: 0 0 calc((100% - 3rem) / 4);  
    min-width: 4rem;
    height: 3.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #2f8d59;
    box-shadow: 0 0.25rem 0.5rem #226741;
    border-radius: 0.5rem;
  }

 
  aside { display: flex; justify-content: flex-end; align-items: flex-start; }
</style>
</head>
<body>
  <header class="box">header</header>

  <div class="middle">
    <main class="box">
      <span>main</span>
      <div class="items">
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
      </div>
    </main>
    <aside class="box">sidebar</aside>
  </div>

  <footer class="box">footer</footer>
</body>
</html>
